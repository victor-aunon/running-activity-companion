schema_version: "1.0"
workflow:
  id: "viteplus-stitch"
  name: "Vite+ Stitch SDD Lifecycle"
  version: "1.0.0"
  author: "victor-aunon"
  description: "Deterministic SDD workflow featuring Vite+, Google Stitch MCP, and architectural & visual quality gates"

requires:
  speckit_version: ">=0.8.5"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the feature you want to build"
  enable_stitch:
    type: boolean
    default: true
    prompt: "Do you want to use Google Stitch for UI design and tokens?"
  integration:
    type: string
    default: "auto"
    prompt: "Agent integration to use (e.g. gemini, claude, copilot; 'auto' uses the project's integration)"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the technical specification in specs/<feature>/spec.md before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} --with-viteplus {% if inputs.enable_stitch %}--with-stitch{% endif %}"

  - id: review-design
    type: gate
    message: "Review the design system and generated screens in specs/<feature>/designs/."
    options: [approve, request_changes]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} --phased"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} --phased --verify-gates"
